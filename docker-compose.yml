version: '3.8'

services:
  # ============================================================================
  # Backend API Service
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: lowcode-scanner-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - MAX_CONCURRENT_SCANS=2
      - SCAN_TIMEOUT=300
    volumes:
      - ./reports:/app/reports
      - ./output:/app/output
      - ./logs:/app/logs
    networks:
      - scanner-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # Frontend Service
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lowcode-scanner-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - scanner-network
    restart: unless-stopped

  # ============================================================================
  # Redis Cache (Optional - for session management)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: lowcode-scanner-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - scanner-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ============================================================================
  # Nginx Reverse Proxy (Optional - for production)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: lowcode-scanner-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - scanner-network
    restart: unless-stopped
    profiles:
      - production

  # ============================================================================
  # Development Services
  # ============================================================================
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: lowcode-scanner-backend-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - CORS_ORIGINS=*
      - MAX_CONCURRENT_SCANS=1
      - SCAN_TIMEOUT=600
    volumes:
      - .:/app
      - /app/venv
      - ./reports:/app/reports
      - ./output:/app/output
      - ./logs:/app/logs
    networks:
      - scanner-network
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: lowcode-scanner-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - scanner-network
    command: npm run dev
    profiles:
      - dev

# ============================================================================
# Networks
# ============================================================================
networks:
  scanner-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  redis-data:
    driver: local
